name: Require signed commits

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  signed-commits:
    name: Commits are signed and verified
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check every commit signature
        shell: bash
        run: |
          set -euo pipefail

          head="${{ github.sha }}"
          shas=""

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            shas=$(gh api "repos/$REPO/pulls/${{ github.event.pull_request.number }}/commits" \
              --paginate --jq '.[].sha' 2>/dev/null || true)
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              # A force-push can leave `before` unreachable; the compare then fails and we
              # fall back to checking only the pushed tip.
              shas=$(gh api "repos/$REPO/compare/${before}...${head}" \
                --jq '.commits[].sha' 2>/dev/null || true)
            fi
          fi

          # Keep only well-formed SHAs; API error payloads must never be treated as commit ids.
          shas=$(printf '%s\n' "$shas" | grep -Eo '^[0-9a-f]{40}$' || true)
          if [ -z "$shas" ]; then
            shas="$head"
          fi

          failed=0
          for sha in $shas; do
            result=$(gh api "repos/$REPO/commits/$sha" \
              --jq '"\(.commit.verification.verified) \(.commit.verification.reason)"')
            verified=${result%% *}
            reason=${result#* }
            if [ "$verified" = "true" ]; then
              echo "OK    $sha ($reason)"
            else
              echo "::error::Commit $sha is not signed or not verified ($reason)"
              failed=1
            fi
          done

          exit $failed
